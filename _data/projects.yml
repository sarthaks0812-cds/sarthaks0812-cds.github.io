- slug: human-powered-vehicle
  title: Electric human-powered vehicle
  summary: Designed a semi-recumbent chassis and studied rider ergonomics. Reduced
    rollover-structure deformation by 30% through geometry optimization and simulated
    a landing-gear mechanism with deployment within 8 seconds.
  period: Team BlueStreak · 2021–2023
  tools: CATIA · ANSYS · Simscape Multibody
