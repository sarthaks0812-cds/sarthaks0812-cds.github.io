title: Sarthak Sahoo
email: sarths@umich.edu
description: Robotics, system dynamics, controls, and experimental mechatronics.
theme: minima
url: "" # Set to https://YOUR-USERNAME.github.io
baseurl: "" # Leave empty for YOUR-USERNAME.github.io; use /REPOSITORY for a project site
markdown: kramdown
plugins:
  - jekyll-seo-tag
collections:
  notes:
    output: true
    permalink: /notes/:name/
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
